<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐馆 - XXXUAN</title>
  <link rel="preload" as="image" href="XXXUANBG.webp">
  <style>
    /* ========== 基础与主题变量 ========== */
    :root {
      --accent: #00ffcc;
      --accent-rgb: 0, 255, 204;
      --panel: rgba(0, 0, 0, 0.6);
      --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    
    /* 赛博滚动条 */
    html {
      color-scheme: dark;
      scrollbar-width: thin;
      scrollbar-color: rgba(var(--accent-rgb), 0.5) transparent;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb), 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), 0.7); }

    body {
      min-height: 100vh;
      margin: 0;
      background: #0a0f12 url('XXXUANBG.webp') no-repeat center center / cover fixed;
      color: #fff;
      font-family: var(--font-sans);
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    body.modal-open {
      overflow: hidden;
      padding-right: 8px; 
    }

    /* ========== 顶部导航栏 ========== */
    .nav-bar {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 20px 40px;
      background-color: rgba(0, 0, 0, 0.9); /* 兜底深色 */
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100;
      transform: translateZ(0); will-change: backdrop-filter;
    }
    .back-btn {
      color: var(--accent); text-decoration: none;
      font-size: 16px; font-weight: bold;
      border: 1px solid var(--accent); padding: 8px 20px; border-radius: 8px;
      transition: all 0.3s;
      cursor: pointer;
    }
    .back-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.4); }
    .page-title { font-size: 22px; font-weight: bold; color: var(--accent); letter-spacing: 2px; margin: 0; }

    /* ========== 专辑画廊 ========== */
    .album-gallery {
      max-width: 1200px; margin: 100px auto 40px; padding: 0 40px;
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 30px;
    }
    .album-card {
      background: var(--panel);
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-radius: 15px; padding: 15px;
      cursor: pointer; transition: all 0.3s;
      text-align: center;
    }
    .album-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(var(--accent-rgb), 0.2);
      border-color: var(--accent);
    }
    .album-cover {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 10px; margin-bottom: 15px;
    }
    .album-name { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .album-desc { color: #aaa; font-size: 13px; }

    /* ========== 专辑内页弹窗 ========== */
    .songs-modal {
      display: none; position: fixed; inset: 0;
      background-color: rgba(10, 10, 10, 0.95); /* 兜底深色 */
      z-index: 200;
      padding: 80px 40px;
      overflow-y: auto;
      overscroll-behavior: contain; 
      transform: translateZ(0);
    }
    .songs-modal.is-open { display: block; animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .close-modal {
      position: fixed; top: 20px; right: 40px;
      background: none; border: none; color: var(--accent); font-size: 40px;
      cursor: pointer; transition: transform 0.3s;
    }
    .close-modal:hover { color: #fff; transform: rotate(90deg); }

    /* 版权声明栏样式 */
    .copyright-bar { text-align: center; margin-bottom: 30px; display: none; }
    .copyright-text {
      display: inline-block; font-size: 13px; color: #ff8a80;
      background: rgba(255, 138, 128, 0.1); border: 1px dashed rgba(255, 138, 128, 0.4);
      padding: 8px 16px; border-radius: 8px; line-height: 1.5; letter-spacing: 1px;
    }

    /* 歌曲列表网格 */
    .songs-grid {
      max-width: 1000px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }

    /* 单曲卡片样式 */
    .song-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      padding: 12px 20px 12px 12px;
      border-radius: 15px; cursor: pointer; transition: all 0.3s;
      display: flex; justify-content: space-between; align-items: center; gap: 15px;
    }
    .song-card:hover, .song-card.playing {
      background: rgba(var(--accent-rgb), 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.3);
    }
    .song-cover-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .song-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .song-title { font-size: 16px; font-weight: bold; color: #fff; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 13px; color: #aaa; margin: 0; }
    .play-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

    /* ========== 底部全局播放器 ========== */
    .global-player {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 15, 15, 0.95); /* 兜底深色 */
      border-top: 1px solid rgba(var(--accent-rgb), 0.3);
      padding: 15px 40px;
      display: flex; align-items: center; gap: 20px;
      z-index: 300; transform: translateY(100%); 
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: backdrop-filter;
    }
    .global-player.show { transform: translateY(0); }
    
    .player-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #000; border: none;
      font-size: 18px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .player-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.5); }

    .mode-btn {
      width: 32px; height: 32px; border-radius: 50%; background: transparent; color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), 0.5); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s;
    }
    .mode-btn:hover { background: rgba(var(--accent-rgb), 0.2); }
    
    .player-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .player-title { font-size: 16px; color: #fff; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 12px; color: #aaa; margin: 0; }
    
    .player-progress { width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; cursor: pointer; flex-shrink: 0; }
    .progress-inner { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }

       /* ============================================================
       全平台终极降级策略 (@supports)
       ============================================================ */
    @supports ((-webkit-backdrop-filter: blur(25px)) or (backdrop-filter: blur(25px))) {
      .nav-bar {
        background-color: rgba(0, 0, 0, 0.55); /* 导航栏透一点 */
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      
      /* ✨ 军师调整：音乐馆弹窗和播放器也降低透明度 ✨ */
      .songs-modal {
        background-color: rgba(10, 10, 10, 0.55); /* 从 0.8 降到 0.55 */
        backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      }
      
      .global-player {
        background: rgba(15, 15, 15, 0.65); /* 播放器稍微透一点 */
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      }
    }
    /* ========== 移动端终极降级打击 ========== */
    @media (max-width: 820px) {
      .nav-bar { padding: 15px 20px; }
      .page-title { font-size: 18px; }
      .album-gallery { padding: 0 20px; margin-top: 80px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
      .album-cover { margin-bottom: 10px; }
      .album-name { font-size: 15px; }
      .songs-modal { padding: 80px 20px; }
      .close-modal { right: 20px; }
      .global-player { padding: 10px 20px; gap: 10px; }
      .player-progress { display: none; } 

      /* 移动端强制关闭毛玻璃 */
      .nav-bar, .songs-modal, .global-player {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .songs-modal {
        background-color: rgba(10, 10, 10, 0.98) !important;
      }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn" id="back-to-home">← 返回档案馆</a>
    <h1 class="page-title">音乐馆 - Music Gallery</h1>
    <div style="width: 80px;"></div>
  </div>

  <div class="album-gallery" id="album-container">
    <p style="text-align:center; width:100%; color:#888;">正在加载专辑...</p>
  </div>

  <div id="songs-modal" class="songs-modal">
    <button class="close-modal" id="close-songs">&times;</button>
    <h2 style="text-align: center; color: var(--accent); margin-bottom: 10px;" id="modal-album-title">专辑名称</h2>
    <div class="copyright-bar" id="modal-copyright-bar">
      <span class="copyright-text" id="modal-copyright-text"></span>
    </div>
    <div class="songs-grid" id="songs-container"></div>
  </div>

  <div class="global-player" id="global-player">
    <button class="player-btn" id="main-play-btn">▶</button>
    <button class="mode-btn" id="play-mode-btn" title="列表循环">🔁</button>
    <div class="player-info">
      <p class="player-title" id="player-title">未播放</p>
      <p class="player-artist" id="player-artist">---</p>
    </div>
    <div class="player-progress" id="player-progress">
      <div class="progress-inner" id="progress-inner"></div>
    </div>
  </div>

  <audio id="global-audio" preload="none"></audio>

  <script>
    (() => {
      'use strict';

      // ================= 1. 主题色同步模块 =================
      function hexToRgb(hex) {
        const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex || '');
        if (!m) return null;
        let h = m[1];
        if (h.length === 3) h = h.split('').map(c => c + c).join('');
        return `${parseInt(h.slice(0, 2), 16)}, ${parseInt(h.slice(2, 4), 16)}, ${parseInt(h.slice(4, 6), 16)}`;
      }
      let savedColor = null;
      try { savedColor = localStorage.getItem('archive-theme-color'); } catch {}
      if (savedColor) {
        const rgb = hexToRgb(savedColor);
        if (rgb) {
          document.documentElement.style.setProperty('--accent', savedColor);
          document.documentElement.style.setProperty('--accent-rgb', rgb);
        }
      }

      // ================= DOM 元素获取 =================
      const albumContainer = document.getElementById('album-container');
      const songsModal = document.getElementById('songs-modal');
      const closeSongsBtn = document.getElementById('close-songs');
      const songsContainer = document.getElementById('songs-container');
      const modalAlbumTitle = document.getElementById('modal-album-title');
      
      const copyrightBar = document.getElementById('modal-copyright-bar');
      const copyrightText = document.getElementById('modal-copyright-text');

      const globalPlayer = document.getElementById('global-player');
      const mainPlayBtn = document.getElementById('main-play-btn');
      const playModeBtn = document.getElementById('play-mode-btn');
      const playerTitle = document.getElementById('player-title');
      const playerArtist = document.getElementById('player-artist');
      const progressInner = document.getElementById('progress-inner');
      const playerProgress = document.getElementById('player-progress');
      
      const audio = document.getElementById('global-audio');

      // ================= 状态管理 =================
      let musicData = [];
      let currentPlayingCard = null; 
      let currentPlaylist = [];      
      let currentSongIndex = -1;     
      let playMode = 0;              

      const savedMode = localStorage.getItem('music-play-mode');
      if (savedMode !== null && !isNaN(parseInt(savedMode))) {
        playMode = parseInt(savedMode);
      }
      updateModeUI();

      // ================= 2. 加载数据与渲染 =================
      async function loadMusic() {
        try {
          const res = await fetch('music.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          musicData = await res.json();
          renderAlbums();
        } catch (err) {
          console.error('加载音乐数据失败:', err);
          albumContainer.innerHTML = `<p style="text-align:center; color:#ff8a80; width:100%;">加载失败：${err.message}</p>`;
        }
      }

      function renderAlbums() {
        albumContainer.innerHTML = '';
        musicData.forEach((album) => {
          const card = document.createElement('div');
          card.className = 'album-card';
          card.innerHTML = `
            <img src="${album.album_cover}" class="album-cover" alt="${album.album_name}">
            <div class="album-name">${album.album_name}</div>
            <div class="album-desc">${album.description || ''}</div>
          `;
          card.onclick = () => openAlbum(album);
          albumContainer.appendChild(card);
        });
      }

      // ================= 3. 弹窗与滚动锁定 =================
      function openAlbum(album) {
        modalAlbumTitle.textContent = album.album_name;
        
        if (album.copyright) {
          copyrightText.textContent = album.copyright;
          copyrightBar.style.display = 'block'; 
        } else {
          copyrightBar.style.display = 'none'; 
        }

        songsContainer.innerHTML = '';
        currentPlaylist = album.songs || []; 

        if (currentPlaylist.length === 0) {
          songsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">此专辑暂未收录歌曲。</p>';
        } else {
          currentPlaylist.forEach((song, index) => {
            const songCard = document.createElement('div');
            songCard.className = 'song-card';
            
            const isPlayingThis = !audio.paused && currentSongIndex === index && audio.src.includes(song.src);
            if (isPlayingThis) {
              songCard.classList.add('playing');
              currentPlayingCard = songCard;
            }

            const coverUrl = song.cover ? song.cover : album.album_cover; 

            songCard.innerHTML = `
              <img src="${coverUrl}" class="song-cover-thumb" alt="${song.title}">
              <div class="song-info">
                <p class="song-title">${song.title}</p>
                <p class="song-artist">${song.artist}</p>
              </div>
              <div class="play-icon">${isPlayingThis ? '⏸' : '▶'}</div>
            `;
            
            songCard.onclick = () => togglePlay(song, index, songCard);
            songsContainer.appendChild(songCard);
          });
        }
        
        songsModal.classList.add('is-open');
        document.body.classList.add('modal-open'); 
      }

      closeSongsBtn.onclick = () => {
        songsModal.classList.remove('is-open');
        document.body.classList.remove('modal-open'); 
      };

      // ================= 4. 核心播放逻辑 =================
      function togglePlay(song, index, songCard) {
        if (!audio.paused && currentSongIndex === index && audio.src.includes(song.src)) {
          audio.pause();
          songCard.classList.remove('playing');
          songCard.querySelector('.play-icon').textContent = '▶';
          mainPlayBtn.textContent = '▶';
          return;
        }

        playSong(song, index, songCard);
      }

      function playSong(song, index, songCard) {
        if (currentPlayingCard) {
          currentPlayingCard.classList.remove('playing');
          currentPlayingCard.querySelector('.play-icon').textContent = '▶';
        }

        currentSongIndex = index;
        audio.src = song.src;
        
        audio.play().then(() => {
          if (songCard) {
            songCard.classList.add('playing');
            songCard.querySelector('.play-icon').textContent = '⏸';
            currentPlayingCard = songCard;
          }
          
          playerTitle.textContent = song.title;
          playerArtist.textContent = song.artist;
          mainPlayBtn.textContent = '⏸';
          globalPlayer.classList.add('show');
          
        }).catch(err => {
          console.error('播放失败', err);
          alert('无法播放该音频，请检查路径或网络。');
        });
      }

      // ================= 5. 播放模式逻辑 =================
      function updateModeUI() {
        if (playMode === 0) {
          playModeBtn.textContent = '🔁';
          playModeBtn.title = '列表循环';
        } else if (playMode === 1) {
          playModeBtn.textContent = '🔂';
          playModeBtn.title = '单曲循环';
        } else if (playMode === 2) {
          playModeBtn.textContent = '🔀';
          playModeBtn.title = '随机播放';
        }
      }

      playModeBtn.onclick = () => {
        playMode = (playMode + 1) % 3;
        updateModeUI();
        localStorage.setItem('music-play-mode', playMode);
      };

      audio.onended = () => {
        if (currentPlaylist.length === 0) return;

        if (playMode === 1) {
          audio.currentTime = 0;
          audio.play();
          return;
        }

        let nextIndex = currentSongIndex;

        if (playMode === 0) {
          nextIndex = (currentSongIndex + 1) % currentPlaylist.length;
        } 
        else if (playMode === 2) {
          if (currentPlaylist.length > 1) {
            do {
              nextIndex = Math.floor(Math.random() * currentPlaylist.length);
            } while (nextIndex === currentSongIndex);
          } else {
            nextIndex = 0;
          }
        }

        const nextSong = currentPlaylist[nextIndex];
        
        let nextCard = null;
        if (songsModal.classList.contains('is-open')) {
           const cards = songsContainer.querySelectorAll('.song-card');
           if (cards[nextIndex]) nextCard = cards[nextIndex];
        }

        playSong(nextSong, nextIndex, nextCard);
      };

      // ================= 6. 底部播放器交互 =================
      mainPlayBtn.onclick = () => {
        if (audio.paused) {
          audio.play();
          mainPlayBtn.textContent = '⏸';
          if (currentPlayingCard) {
            currentPlayingCard.classList.add('playing');
            currentPlayingCard.querySelector('.play-icon').textContent = '⏸';
          }
        } else {
          audio.pause();
          mainPlayBtn.textContent = '▶';
          if (currentPlayingCard) {
            currentPlayingCard.classList.remove('playing');
            currentPlayingCard.querySelector('.play-icon').textContent = '▶';
          }
        }
      };

      audio.ontimeupdate = () => {
        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressInner.style.width = `${percent}%`;
        }
      };
      
      playerProgress.onclick = (e) => {
        if (audio.duration) {
          const rect = playerProgress.getBoundingClientRect();
          const percent = (e.clientX - rect.left) / rect.width;
          audio.currentTime = percent * audio.duration;
        }
      };

      // ================= 7. 返回主页渐弱效果 =================
      document.getElementById('back-to-home').onclick = (e) => {
        e.preventDefault();
        const targetUrl = 'index.html';
        
        if (audio.paused) {
          window.location.href = targetUrl;
          return;
        }
        
        let vol = audio.volume;
        const fadeOut = setInterval(() => {
          if (vol > 0.05) {
            vol -= 0.05;
            audio.volume = vol;
          } else {
            clearInterval(fadeOut);
            audio.pause();
            window.location.href = targetUrl;
          }
        }, 50);
      };

      // 启动
      loadMusic();
    })();
  </script>
</body>
</html>
