<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffcc">
  <title>音乐馆 - XXXUAN</title>
  <link rel="preload" as="image" href="XXXUANBG.webp">
  <link rel="stylesheet" href="styles-m.css">
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn" id="back-to-home">← 返回档案馆</a>
    <h1 class="page-title">音乐馆 - Music Gallery</h1>
    <div style="width: 80px;"></div>
  </div>

  <div class="album-gallery" id="album-container">
    <p style="text-align:center; width:100%; color:#888;">正在加载专辑...</p>
  </div>

 <!-- 歌曲列表弹窗 -->
<div id="songs-modal" class="songs-modal" role="dialog" aria-modal="true" aria-labelledby="modal-album-title" aria-hidden="true">
  
  <!-- ① 关闭按钮：留在外面，不动它 -->
  <button class="close-modal" id="close-songs" type="button" aria-label="关闭歌曲列表">&times;</button>
  
  <!-- ② 新增一个滚动容器，把原来剩下的所有内容都包进去 -->
  <div class="modal-scroll">
    <div class="modal-header-area">
      <h2 style="color: var(--accent); margin: 0 0 10px;" id="modal-album-title">专辑名称</h2>
      <div class="copyright-bar" id="modal-copyright-bar">
        <span class="copyright-text" id="modal-copyright-text"></span>
      </div>
    </div>

    <div class="search-container" id="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索歌名、曲师或简介..." autocomplete="off">
    </div>

    <div class="songs-grid" id="songs-container"></div>
  </div><!-- ③ 滚动容器结束 -->

</div>

 <!-- 歌词弹窗 -->
<div id="lyrics-modal" class="lyrics-modal" role="dialog" aria-modal="true" aria-labelledby="lyrics-title" aria-hidden="true">
  <button class="close-modal" id="close-lyrics" type="button" aria-label="关闭歌词">&times;</button>
  <h2 style="text-align: center; color: var(--accent); margin-bottom: 30px;" id="lyrics-title">歌词</h2>
  <div class="lyrics-content" id="lyrics-content"></div>
</div>

  <!-- 全局底部播放器 -->
  <div class="global-player" id="global-player">
    <button class="player-btn" id="main-play-btn" type="button" aria-label="播放/暂停">▶</button>
    <button class="mode-btn" id="play-mode-btn" type="button" title="列表循环" aria-label="切换播放模式">🔁</button>
    <button class="lyric-btn" id="lyric-btn" type="button" title="查看歌词" aria-label="查看歌词" disabled>📝</button>

    <div class="player-info">
      <div class="marquee-container"><p class="player-title marquee-text" id="player-title">未播放</p></div>
      <div class="marquee-container"><p class="player-artist marquee-text" id="player-artist">---</p></div>
    </div>

    <div class="player-progress-wrap">
      <div class="player-progress" id="player-progress">
        <div class="progress-inner" id="progress-inner"></div>
      </div>
      <span class="time-display" id="time-display">00:00 / 00:00</span>
    </div>
  </div>

  <audio id="global-audio" preload="none"></audio>

  <script src="common.js"></script>
  <script src="music.js"></script>
</body>
</html>
