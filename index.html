<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXXUAN档案馆</title>
  <style>
    /* ========== 变量 & 基础 ========== */
    :root {
      --accent: #00ffcc;
      --panel: rgba(0, 0, 0, 0.6);
      --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { height: 100%; }

    body {
      min-height: 100%;
      margin: 0;
      background-image: url('NahidaBG.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #0a0f12;
      color: #fff;
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* ========== 左侧主体 ========== */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      height: 100vh;
      height: 100dvh;
      width: 30vw;
      max-width: 400px;
      padding: 40px;
      background-color: var(--panel);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 0 15px 15px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }

    h1 {
      color: var(--accent);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      margin-top: 0;
    }

    p {
      color: #fff;
      font-size: 18px;
      line-height: 1.6;
    }

    /* ========== 顶部 BGM 信息（居中偏右 / 顶部居右） ========== */
    .top-info {
      position: fixed;
      top: 20px;
      right: 20px;           /* ← 改成贴右显示 */
      left: auto;
      max-width: min(90vw, 460px);
      text-align: right;
      background-color: var(--panel);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
      pointer-events: none;
      z-index: 50;
    }

    .top-info.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ========== 底部版权 ========== */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding-left: 5vw;
      padding-right: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .bg-note {
      display: block;
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.6;
    }

    /* ========== 音乐按钮 ========== */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: rgba(0, 255, 204, 0.8);
      color: #1e1e1e;
      border: none;
      border-radius: 30px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s, transform 0.3s;
      z-index: 100;
    }

    .music-btn:hover { background-color: #00ffcc; transform: scale(1.05); }
    .music-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* ========== 右侧入口按钮 ========== */
    .projects {
      position: absolute;
      top: 50%;
      right: 10%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .project-btn {
      background-color: var(--panel);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 15px 30px;
      border-radius: 10px;
      color: var(--accent);
      border: 1px solid var(--accent);
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }

    .project-btn:hover {
      background-color: rgba(0, 255, 204, 0.2);
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }

    .project-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* ========== 随笔全屏画廊 ========== */
    .essay-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 900;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .essay-modal.is-open {
      display: flex;
      animation: fadeIn 0.3s ease both;
    }

    .essay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .essay-header h2 {
      color: var(--accent);
      margin: 0;
      letter-spacing: 2px;
      font-size: 22px;
    }

    .close-btn {
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
      color: var(--accent);
      font-size: 35px;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.3s, transform 0.3s;
    }

    .close-btn:hover { color: #fff; transform: rotate(90deg); }
    .close-btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 6px; }

    .essay-content {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .essay-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.3);
      padding: 25px;
      border-radius: 15px;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }

    .essay-card:hover,
    .essay-card:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      transform: translateY(-5px);
      outline: none;
    }

    .essay-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .essay-card h3 {
      color: #fff;
      margin: 0 0 8px;
      font-size: 20px;
    }

    .essay-date {
      display: block;
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .essay-card p {
      color: #ccc;
      line-height: 1.8;
      margin: 0;
      font-size: 16px;
    }

    .essay-empty,
    .essay-error {
      text-align: center;
      color: #bbb;
      font-size: 16px;
      line-height: 1.8;
      padding: 40px 20px;
      word-break: break-word;
    }

    .essay-error { color: #ff8a8a; }

    /* ========== 随笔详情页 ========== */
    .essay-detail-view {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(10, 10, 10, 0.97);
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
      overscroll-behavior: contain;
      z-index: 1000;
    }

    .essay-detail-view.is-open {
      display: flex;
      animation: fadeIn 0.25s ease both;
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding-bottom: 20px;
      background: linear-gradient(rgba(10, 10, 10, 0.97) 70%, rgba(10, 10, 10, 0));
    }

    .back-btn {
      background: rgba(0, 255, 204, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    .back-btn:hover { background: var(--accent); color: #000; }
    .back-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .detail-content {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    #detail-title {
      color: #fff;
      margin-top: 0;
      font-size: 28px;
      line-height: 1.4;
      word-break: break-word;
    }

    .detail-body {
      color: #ddd;
      line-height: 2;
      font-size: 17px;
      margin-top: 30px;
      text-align: justify;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    /* ========== 滚动条美化 ========== */
    .essay-modal,
    .essay-detail-view {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 204, 0.5) transparent;
    }

    .essay-modal::-webkit-scrollbar,
    .essay-detail-view::-webkit-scrollbar { width: 8px; }

    .essay-modal::-webkit-scrollbar-thumb,
    .essay-detail-view::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 204, 0.4);
      border-radius: 4px;
    }

    /* ========== 动画 ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== 移动端 ========== */
    @media (max-width: 820px) {
      body {
        overflow: auto;
        overflow-x: hidden;
      }

      .content {
        position: relative;
        width: 100%;
        max-width: none;
        height: auto;
        min-height: 55vh;
        padding: 48px 24px;
        border-radius: 0 0 15px 15px;
      }

      .projects {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        margin: 40px 24px 40px;
      }

      .project-btn { width: 100%; }

      .footer {
        position: relative;
        bottom: auto;
        padding: 0 20px 90px;
      }

      .essay-modal { padding: 24px 16px; }
      .essay-detail-view { padding: 20px 16px; }
      .essay-header h2 { font-size: 18px; }
      .detail-content { max-width: 100%; }
      #detail-title { font-size: 22px; }
      .detail-body { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- 顶部 BGM 信息（顶部居右） -->
  <div class="top-info" id="bgm-info" aria-hidden="true">BGM：25時の情熱Inst. -カンザキイオリ ©SEGA</div>

  <!-- 左侧主体内容 -->
  <div class="content">
    <h1>欢迎回来！</h1>
    <p>该网站用于编程技能学习及测试，以及顺带的个性展示和小功能<br>由 XXXUAN 搭建。</p>
  </div>

  <!-- 右侧功能区 -->
  <div class="projects">
    <button id="open-essays" class="project-btn" type="button">📝 随笔手记</button>
  </div>

  <!-- ========== 随笔全屏画廊 ========== -->
  <div id="essay-modal" class="essay-modal" aria-hidden="true">
    <div class="essay-header">
      <h2>XXXUAN随笔手记</h2>
      <button id="close-essay" class="close-btn" type="button" aria-label="关闭随笔">&times;</button>
    </div>

    <!-- 卡片由 JS 从 essays.json 生成 -->
    <div class="essay-content" id="essay-list-container"></div>

    <!-- 随笔详情页 -->
    <div id="essay-detail-view" class="essay-detail-view" aria-hidden="true">
      <div class="detail-header">
        <button class="back-btn" type="button">← 返回列表</button>
      </div>
      <div class="detail-content">
        <h1 id="detail-title">标题</h1>
        <span id="detail-date" class="essay-date">日期</span>
        <div id="detail-body" class="detail-body"></div>
      </div>
    </div>
  </div>

  <!-- 底部信息 -->
  <div class="footer">
    Copyright © 2026 XXXUAN
    <span class="bg-note">Background：Nahida From Genshin Impact ©miHoYo</span>
  </div>

  <!-- 音乐播放 -->
  <audio id="bgm" loop preload="metadata">
    <source src="nijuugoji_no_jounetsu-Inst.ogg" type="audio/ogg">
    <source src="nijuugoji_no_jounetsu-Inst.mp3" type="audio/mpeg">
  </audio>
  <button id="music-btn" class="music-btn" type="button" aria-pressed="false">▶ ２５時の旋律</button>

  <script>
    (() => {
      'use strict';

      /* ============================================================
         一、BGM 控制
         ============================================================ */
      const bgm = document.getElementById('bgm');
      const musicBtn = document.getElementById('music-btn');
      const bgmInfo = document.getElementById('bgm-info');
      const BGM_TEXT = 'BGM：25時の情熱Inst. -カンザキイオリ ©SEGA';

      function setBgmUI(playing) {
        musicBtn.textContent = playing ? '⏸ 夜幕の静謐' : '▶ ２５時の旋律';
        musicBtn.setAttribute('aria-pressed', String(playing));
        bgmInfo.classList.toggle('show', playing);
        bgmInfo.setAttribute('aria-hidden', String(!playing));
      }

      musicBtn.addEventListener('click', async () => {
        if (!bgm.paused) {
          bgm.pause();
          setBgmUI(false);
          return;
        }
        try {
          await bgm.play();
          setBgmUI(true);
        } catch (err) {
          console.error('BGM 播放失败：', err);
          bgmInfo.textContent = '音频加载失败，请检查音频文件是否存在';
          bgmInfo.classList.add('show');
          bgmInfo.setAttribute('aria-hidden', 'false');
          setTimeout(() => {
            bgmInfo.textContent = BGM_TEXT;
            bgmInfo.classList.remove('show');
            bgmInfo.setAttribute('aria-hidden', 'true');
          }, 3000);
        }
      });

      /* ============================================================
         二、工具函数
         ============================================================ */
      const escapeHtml = (str) => String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      /**
       * 安全渲染正文：
       * - 所有 HTML 先转义，防止 XSS
       * - 只放行 <br>，保留你 JSON 里原有的 <br> 换行写法
       * - 同时支持 \n 换行
       */
      const renderRichText = (text) => escapeHtml(text)
        .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
        .replace(/\r?\n/g, '<br>');

      /* ============================================================
         三、随笔模块
         ============================================================ */
      const essayModal = document.getElementById('essay-modal');
      const detailView = document.getElementById('essay-detail-view');
      const listContainer = document.getElementById('essay-list-container');
      const detailTitle = document.getElementById('detail-title');
      const detailDate = document.getElementById('detail-date');
      const detailBody = document.getElementById('detail-body');
      const backBtn = detailView.querySelector('.back-btn');

      let essaysData = [];

      /* ---- 打开详情 ---- */
      function openEssayDetail(index) {
        const essay = essaysData[index];
        if (!essay) return;

        detailTitle.textContent = essay.title || '无标题';
        detailDate.textContent = essay.date || '';
        detailBody.innerHTML = renderRichText(essay.content);

        detailView.classList.add('is-open');
        detailView.setAttribute('aria-hidden', 'false');
        detailView.scrollTop = 0;
        backBtn.focus({ preventScroll: true });
      }

      /* ---- 关闭详情 ---- */
      function closeEssayDetail() {
        if (!detailView.classList.contains('is-open')) return;
        detailView.classList.remove('is-open');
        detailView.setAttribute('aria-hidden', 'true');
      }

      /* ---- 渲染卡片列表 ---- */
      function renderEssays() {
        listContainer.innerHTML = '';

        if (!essaysData.length) {
          const empty = document.createElement('p');
          empty.className = 'essay-empty';
          empty.textContent = '这里还空空如也……';
          listContainer.appendChild(empty);
          return;
        }

        const frag = document.createDocumentFragment();

        essaysData.forEach((essay, index) => {
          const card = document.createElement('div');
          card.className = 'essay-card';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.setAttribute('aria-label', `阅读：${essay.title || '无标题'}`);

          const h3 = document.createElement('h3');
          h3.textContent = essay.title || '无标题';

          const date = document.createElement('span');
          date.className = 'essay-date';
          date.textContent = essay.date || '';

          const p = document.createElement('p');
          p.textContent = essay.summary || '';

          card.append(h3, date, p);

          card.addEventListener('click', () => openEssayDetail(index));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openEssayDetail(index);
            }
          });

          frag.appendChild(card);
        });

        listContainer.appendChild(frag);
      }

      /* ---- 加载数据 ---- */
      async function loadEssays() {
        try {
          if (location.protocol === 'file:') {
            throw new Error('当前通过 file:// 直接打开，浏览器会阻止读取 essays.json。请用 Live Server 等本地服务器，或部署到线上。');
          }

          const res = await fetch('essays.json', { cache: 'no-cache' });
          if (!res.ok) {
            throw new Error(`请求 essays.json 失败（HTTP ${res.status} ${res.statusText}）`);
          }

          const data = await res.json();

          if (!Array.isArray(data)) {
            throw new Error('essays.json 的顶层必须是数组');
          }

          essaysData = data.filter((item) => item && typeof item === 'object');
          renderEssays();
        } catch (err) {
          console.error('加载随笔数据失败：', err);
          listContainer.innerHTML = '';
          const tip = document.createElement('p');
          tip.className = 'essay-error';
          tip.textContent = `数据加载失败：${err.message}`;
          listContainer.appendChild(tip);
        }
      }

      /* ============================================================
         四、打开 / 关闭画廊
         ============================================================ */
      document.getElementById('open-essays').addEventListener('click', () => {
        essayModal.classList.add('is-open');
        essayModal.setAttribute('aria-hidden', 'false');
        essayModal.scrollTop = 0;
      });

      document.getElementById('close-essay').addEventListener('click', () => {
        essayModal.classList.remove('is-open');
        essayModal.setAttribute('aria-hidden', 'true');
        closeEssayDetail();
      });

      backBtn.addEventListener('click', closeEssayDetail);

      /* ESC 逐层关闭 */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;

        if (detailView.classList.contains('is-open')) {
          closeEssayDetail();
        } else if (essayModal.classList.contains('is-open')) {
          essayModal.classList.remove('is-open');
          essayModal.setAttribute('aria-hidden', 'true');
        }
      });

      /* ---- 启动 ---- */
      loadEssays();
    })();
  </script>

</body>
</html>
