<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXXUAN档案馆</title>
  <style>
    /* 基础设置：取消默认居中，改为相对定位，让元素可以自由布局 */
    body {
      background-image: url('NahidaBG.webp'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed; 
      color: white;
      font-family: sans-serif;
      height: 100vh;
      margin: 0;
      overflow: hidden; /* 防止出现滚动条，保持版面整洁 */
      position: relative; /* 为内部的绝对定位做参考 */
    }

    /* ---- 左侧主体内容区（改造为边栏） ---- */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      height: 100vh; 
      width: 30vw; /* 这里控制边栏宽度：20vw变窄，30vw变宽 */
      max-width: 400px; /* 防止在超大屏幕上变得太宽 */
      
      background-color: rgba(0, 0, 0, 0.6); 
      padding: 40px;
      text-align: left; /* 文字居左 */
      backdrop-filter: blur(5px); 
      
      border-radius: 0 15px 15px 0; /* 左侧贴边，右侧圆角 */
      
      /* 让内部文字在边栏中垂直居中 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    
    h1 { 
      color: #00ffcc; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      margin-top: 0;
    }
    p { 
      color: #ffffff; 
      font-size: 18px;
      line-height: 1.6;
    }

    /* ---- 顶部 BGM 信息框 ---- */
    .top-info {
      position: absolute;
      top: 20px;
      left: 60%; /* 居中偏右 */
      background-color: rgba(0, 0, 0, 0.6); /* 同款半透明黑底 */
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      backdrop-filter: blur(5px);
      
      /* 新增：默认隐身，且带有淡入淡出过渡 */
      opacity: 0; 
      visibility: hidden; 
      transition: all 0.5s ease; 
    }

    /* 新增：BGM信息框的出现状态 */
    .top-info.show {
      opacity: 1;
      visibility: visible;
    }

    /* ---- 底部信息栏（版权 + 背景图信息） ---- */
    .footer {
      position: absolute;
      bottom: 20px;
      padding-left: 30vw; /* 让底部文字栏直接避开左边边栏的宽度 */
      width: 100%; /* 动态计算剩下的宽度 */
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
    }
    
    /* 底部关于背景图的说明文字（小字，无黑底） */
    .bg-note {
      display: block;
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.6;
    }

    /* ---- BGM 播放按钮 ---- */
    .music-btn {
      position: absolute; 
      bottom: 20px; 
      right: 20px; 
      padding: 10px 20px;
      background-color: rgba(0, 255, 204, 0.8); 
      color: #1e1e1e;
      border: none; 
      border-radius: 30px; 
      font-weight: bold; 
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
      transition: all 0.3s; 
      z-index: 100;
    }
    .music-btn:hover { 
      background-color: #00ffcc; 
      transform: scale(1.05); 
    }
  </style>
</head>
<body>

  <!-- 顶部 BGM 信息 -->
  <div class="top-info" id="bgm-info">BGM：25時の情熱Inst. -カンザキイオリ ©SEGA</div>

  <!-- 左侧主体内容 -->
  <div class="content">
    <h1>欢迎回来！</h1>
    <p>该网站用于编程技能学习及测试，以及顺带的个性展示和小功能<br>由 XXXUAN 搭建。</p>
  </div>

  <!-- 底部信息 -->
  <div class="footer">
    Copyright © 2026 XXXUAN
    <span class="bg-note">Background：Nahida From Genshin Impact ©miHoYo</span>
  </div>

  <!-- 音乐播放 -->
  <audio id="bgm" loop>
    <source src="nijuugoji_no_jounetsu-Inst.ogg" type="audio/ogg">
    <source src="nijuugoji_no_jounetsu-Inst.mp3" type="audio/mpeg">
  </audio>
  <button id="music-btn" class="music-btn">▶ ２５時の旋律</button>

  <script>
    const bgm = document.getElementById('bgm');
    const btn = document.getElementById('music-btn');
    const bgmInfo = document.getElementById('bgm-info'); // 获取顶部信息框

    btn.addEventListener('click', () => {
      if (bgm.paused) {
        bgm.play();
        btn.innerText = "⏸ 夜幕の静謐";
        bgmInfo.classList.add('show'); // 播放时显示信息
      } else {
        bgm.pause();
        btn.innerText = "▶ ２５時の旋律";
        bgmInfo.classList.remove('show'); // 暂停时隐藏信息
      }
    });
  </script>

</body>
</html>
